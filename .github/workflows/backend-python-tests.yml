# Runs Python unit tests for backend Cloud Function bundles.
# Failing jobs mark the commit/PR as failed (use branch protection → "Require status checks"
# to block merges; pushes to the default branch still complete, but show a red X).

name: Backend Python tests

on:
  push:
    branches: [main, master, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-python-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-runner:
    name: Core runner (LangGraph / workflows)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core/functions/runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/core/functions/runner/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  integration-bundle:
    name: Integration bridge bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/integration/functions/bundle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/integration/functions/bundle/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
