# Runs Python unit tests for Cloud Function bundles (repo root = this backend project).
# Failing jobs mark the commit/PR as failed (branch protection → require these checks to block merges).

name: Backend Python tests

on:
  push:
    branches: [main, master, dev]
    paths:
      - "core/**"
      - "integration/**"
      - "api/**"
      - "scripts/check_routes.py"
      - ".github/workflows/backend-python-tests.yml"
  pull_request:
    paths:
      - "core/**"
      - "integration/**"
      - "api/**"
      - "scripts/check_routes.py"
      - ".github/workflows/backend-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway-route-parity:
    name: API gateway + bundle route parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Terraform vs public_api.py (integration routes)
        run: python scripts/check_routes.py

  core-runner:
    name: Core runner (LangGraph / workflows)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/functions/runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/functions/runner/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  integration-bundle:
    name: Integration bridge bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/functions/bundle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integration/functions/bundle/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
